aid: kumu-networks
name: Kumu Networks
description: >-
  Kumu Networks, Inc. is a Sunnyvale, California semiconductor and RF technology company
  founded in 2011 to commercialize Stanford University research into full-duplex wireless
  and self-interference cancellation (SIC). Its silicon and module products — RF integrated
  circuits, cancellers such as the K8 canceller prototype, and self-interference-cancelling
  smart repeaters — let a radio transmit and receive on the same or an adjacent channel at
  the same time, across roughly 200 MHz to 60 GHz, targeting 4G/5G/6G infrastructure, Wi-Fi,
  IoT, satellite, and defense and aerospace programs including US Army demonstrations and
  Department of Defense dynamic spectrum-sharing work. The company raised roughly $45M from
  investors including Khosla Ventures, New Enterprise Associates, Cisco Investments,
  Deutsche Telekom, Verizon Ventures, Swisscom, Singtel Innov8 and Third Point, and its
  shares trade on secondary marketplaces. Kumu Networks licenses hardware IP and sells
  modules to wireless equipment manufacturers rather than operating a public developer
  platform: as of August 2026 it publishes no developer portal, API documentation,
  OpenAPI/AsyncAPI specification, SDKs, CLI or public code repositories, and its own website
  at kumunetworks.com returns HTTP 404 from its WP Engine host (last successful Internet
  Archive capture 2024-08-10).
